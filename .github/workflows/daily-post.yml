name: Daily post

# Publishes the next item in content/schedule.json through the official
# Instagram Graph API. Does nothing until IG_USER_ID / IG_ACCESS_TOKEN secrets
# and the MEDIA_BASE_URL variable are configured (see docs/PUBLISHING.md).

on:
  schedule:
    - cron: "17 0 * * *"   # 00:17 UTC daily; adjust to your audience
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: cfg
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$MEDIA_BASE_URL" ]; then
            echo "Publishing not configured yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Publish next item
        if: steps.cfg.outputs.ready == 'true'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m atlas next --base-url "${{ vars.MEDIA_BASE_URL }}"
      - name: Record what was posted
        if: steps.cfg.outputs.ready == 'true'
        run: |
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          git add content/published.json
          git diff --cached --quiet || (git commit -m "Log published post" && git push)
